# NB: this name is used in the status badge
name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 6"  # 5:00 UTC every Saturday

jobs:
  build:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}, ${{ matrix.vcs }}
    # ubuntu-latest aka ubuntu-24.04 has busted bzr
    runs-on: ${{ matrix.vcs == 'bzr' && matrix.os == 'ubuntu-latest' && 'ubuntu-22.04' || matrix.os }}
    continue-on-error: ${{ matrix.python-version == 'pypy3.11' || matrix.vcs == 'bzr'}}

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "pypy3.11"
        os:
          - ubuntu-latest
          - windows-latest
        vcs:
          - bzr
          - git
          - hg
          - svn

    steps:
      - name: Install OS-level dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y brz git mercurial subversion

      - name: Install OS-level dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install --no-progress hg svn

      - name: Install OS-level dependencies (Windows, bzr)
        if: runner.os == 'Windows' && matrix.vcs == 'bzr'
        # choco install bzr has been failing lately because launchpad times out
        # if you try to download the bzr windows installer, so only try to
        # install it for matrix.vcs == 'bzr' jobs
        run: |
          choco install --no-progress bzr hg svn

      - name: Git clone
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: |
            setup.py

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U setuptools wheel
          python -m pip install -U coverage pytest flake8
          python -m pip install -e '.[test]'

      - name: Run tests
        shell: bash
        run: |
          # It is utter nonsense that I have to do this
          case "$RUNNER_OS" in
            Windows)
              PATH=$PATH:"/c/Program Files (x86)/Bazaar"
              PATH=$PATH:"/c/Program Files (x86)/Subversion/bin"
              PATH=$PATH:"/c/Program Files/Mercurial"
              ;;
          esac

          set -x

          git --version
          hg --version
          svn --version
          bzr --version || true

          coverage run -m pytest
        env:
          SKIP_NO_TESTS: "1"
          FORCE_TEST_VCS: ${{ matrix.vcs }}

      - name: Check test coverage
        run: |
          coverage xml
          coverage report -m --fail-under=${{ runner.os == 'Windows' && '98' || matrix.vcs == 'bzr' && 99 || 100 }}

      - name: Run check-manifest on itself
        run: python check_manifest.py

      - name: Report to coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true  # coveralls is unreliable
        with:
          file: coverage.xml

  lint:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toxenv:
          - flake8
          - mypy
          - isort
          - check-manifest
          - check-python-versions

    steps:
      - name: Git clone
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.default_python || '3.12' }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ env.default_python || '3.12' }}"

      - name: Pip cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.toxenv }}-${{ hashFiles('tox.ini', 'setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.toxenv }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U setuptools wheel
          python -m pip install -U tox

      - name: Run ${{ matrix.toxenv }}
        run: python -m tox -e ${{ matrix.toxenv }}
